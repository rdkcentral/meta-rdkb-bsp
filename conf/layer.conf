# Add this layer's recipes and appends to BitBake's metadata search path.
BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    "

BBFILE_COLLECTIONS += "rdkb-bsp"
BBFILE_PATTERN_rdkb-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_rdkb-bsp = "6"

LAYERDEPENDS_rdkb-bsp = "core"
LAYERSERIES_COMPAT_rdkb-bsp = "wrynose"
